<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard - Manage Inventory</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; }
        .navbar { background-color: #2c3e50; padding: 1rem; color: white; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
        .table th, .table td { text-align: left; padding: 1rem; border-bottom: 1px solid #ecf0f1; }
        .table th { background-color: #f8f9fa; color: #2c3e50; }
        .form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; background: #f8f9fa; padding: 2rem; border-radius: 8px; margin-bottom: 2rem; }
        .form h2 { grid-column: span 2; margin-top: 0; font-size: 1.25rem; }
        .form input { padding: 0.75rem; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 1rem; }
        .btn { background-color: #3498db; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 1rem; }
        .btn:hover { background-color: #2980b9; }
        .btn-add { grid-column: span 2; background-color: #e67e22; margin-top: 1rem; }
        .btn-add:hover { background-color: #d35400; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">📚 Bookstore Admin</div>
        <div class="nav-links">
            <a href="{% url 'book_list' %}">Shop View</a>
            <a href="{% url 'staff_manage_books' %}">Manage Books</a>
        </div>
    </div>

    <div class="container">
        <h1>Inventory Management</h1>

        <form method="post" class="form">
            {% csrf_token %}
            <h2>Add New Book</h2>
            <input type="text" name="title" placeholder="Book Title" required>
            <input type="text" name="author" placeholder="Author Name" required>
            <input type="number" step="0.01" name="price" placeholder="Price (e.g. 19.99)" required>
            <input type="number" name="stock" placeholder="Stock Quantity" required>
            <button type="submit" class="btn btn-add">Add to Inventory</button>
        </form>

        <h2>Current Stock</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                <tr>
                    <td>{{ book.id }}</td>
                    <td>{{ book.title }}</td>
                    <td>{{ book.author }}</td>
                    <td>${{ book.price }}</td>
                    <td>{{ book.stock }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="5">No books in inventory.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
