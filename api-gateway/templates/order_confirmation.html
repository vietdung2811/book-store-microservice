<!DOCTYPE html>
<html>
<head>
    <title>Order Confirmed</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        .navbar { background-color: #2c3e50; padding: 1rem; color: white; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 800px; margin: 4rem auto; padding: 3rem; background: white; text-align: center; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #27ae60; }
        .btn { background-color: #3498db; color: white; border: none; padding: 1rem 2rem; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 2rem; font-size: 1.1rem; }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">📚 My Bookstore</div>
        <div class="nav-links">
            <a href="{% url 'book_list' %}">Shop</a>
            {% if customer %}
                <a href="{% url 'view_cart' %}">🛒 Cart ({{ customer.name }})</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </div>
    </div>

    <div class="container">
        <h1>🎉 Thank You For Your Order!</h1>
        <p>Your purchase has been confirmed and will be processed shortly.</p>
        <a href="{% url 'book_list' %}" class="btn">Continue Shopping</a>
    </div>
</body>
</html>
