services:
  mariadb:
    image: mariadb:latest
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_USER=user
      - MARIADB_PASSWORD=password
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  customer-service:
    build: ./customer-service
    ports:
      - "8001:8000"
    environment:
      - DB_NAME=customer_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=mariadb
      - DB_PORT=3306
    volumes:
      - ./customer-service:/app
    depends_on:
      - mariadb
  book-service:
    build: ./book-service
    ports:
      - "8002:8000"
    environment:
      - DB_NAME=book_db
      - DB_USER=user
