services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  customer-service:
    build: ./customer-service
    ports:
      - "8001:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=${CUSTOMER_DB}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}

  book-service:
    build: ./book-service
    ports:
      - "8002:8000"
    depends_on:
      - db
    environment:
