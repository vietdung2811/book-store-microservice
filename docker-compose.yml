services:
  mariadb:
    image: mariadb:latest
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_USER=user
      - MARIADB_PASSWORD=password
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  customer-service:
    build: ./customer-service
    ports:
      - "8001:8000"
    environment:
      - DB_NAME=customer_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=mariadb
      - DB_PORT=3306
    volumes:
      - ./customer-service:/app
    depends_on:
      - mariadb
  book-service:
    build: ./book-service
    ports:
      - "8002:8000"
    environment:
      - DB_NAME=book_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=mariadb
      - DB_PORT=3306
    volumes:
      - ./book-service:/app
    depends_on:
      - mariadb
  cart-service:
    build: ./cart-service
    ports:
      - "8003:8000"
    environment:
      - DB_NAME=cart_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=mariadb
      - DB_PORT=3306
    volumes:
      - ./cart-service:/app
    depends_on:
      - mariadb
  order-service:
    build: ./order-service
    ports:
      - "8007:8000"
    environment:
      - DB_NAME=order_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=mariadb
      - DB_PORT=3306
    volumes:
      - ./order-service:/app
    depends_on:
      - mariadb
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=gateway_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=mariadb
      - DB_PORT=3306
    volumes:
      - ./api-gateway:/app
    depends_on:
      - mariadb

volumes:
  mariadb-data:
